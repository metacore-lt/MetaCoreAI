Options -Indexes

# The anonymous Context Lab is a static read-only surface.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$ [NC]
  RewriteRule ^ - [R=405,L]
</IfModule>

<IfModule mod_headers.c>
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
  Header always set Referrer-Policy "no-referrer"
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=()"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always unset Set-Cookie

  <FilesMatch "\.(?:html|json)$">
    Header always set Cache-Control "public, max-age=60, must-revalidate"
  </FilesMatch>
  <FilesMatch "\.(?:js|css)$">
    Header always set Cache-Control "public, max-age=300, must-revalidate"
  </FilesMatch>
</IfModule>
